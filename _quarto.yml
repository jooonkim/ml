project:
  type: website
  render:
    - index.qmd
    - 404.qmd

website:
  title: "ML Notes"
  site-url: https://jooonkim.github.io/ml/
  repo-url: https://github.com/jooonkim/ml
  repo-actions: [edit]
  navbar:
    left:
      - text: Journal
        href: index.qmd
      - text: Chapter notebooks
        href: https://github.com/jooonkim/ml/tree/main/notebooks
    right:
      - icon: github
        href: https://github.com/jooonkim/ml

format:
  html:
    theme: cosmo
    toc: true
    toc-title: Topics
    toc-depth: 2
    code-copy: true
    highlight-style: github

execute:
  freeze: true
  eval: false
  echo: true
  warning: false
